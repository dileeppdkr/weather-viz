[project]
name = "weather-viz"
version = "0.1.0"
description = "Fetch weather data from Open-Meteo and chart it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
]

[project.scripts]
weather-viz = "weather_viz.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
